<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A button, and the press leaving it.

       The one thing this control does that a command bar button does not is
       hand the press to somebody else's code, so the mark is a button plus the
       thing that leaves it: a pill carrying a label, and a chevron clear of its
       right edge. The chevron is the event, not a "next" arrow, which is why
       there is a gap rather than a join.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family
       rather than beside it. Declared in userSpaceOnUse and spanning the whole
       96 canvas, so the pill samples the part of the ramp it sits on and the
       chevron samples the part it flies through: the mark reads as one object
       lit from the top right, which is also why the chevron is ramp-filled
       rather than white.

       It is a wide mark in a square canvas, like the PCFHub top face it
       replaces, rather than a square one. Filling the canvas vertically would
       mean a taller button, and a tall button is not a button.

       Drawn for 32px, and three earlier attempts are why it looks like this.

       A cursor arrow over a rounded rectangle put three shapes and four weights
       inside 32 pixels; the cursor read as a smudge and the whole mark read as
       "a document". The second attempt was this composition drawn small enough
       to letterbox inside its own canvas, which looked like a mark for
       something else seen from far away.

       The third is the one worth recording, because it looked right until it
       was put beside the others: the label was a *circle*, offset left, and a
       pill with a dot in it at 32px is a TOGGLE SWITCH in the off position.
       Four variants were rendered side by side at 72, 32 and 32-on-dark to
       settle it; the bar was the only interior that still read as a button.
       An empty pill reads as a tag, and two bars lose the second one at 32.

       Two weights, one silhouette, and the only detail is the gap, which is 12
       units here and survives to four pixels at 32.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="action-ramp" x1="4" y1="78" x2="92" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>

  <!-- The button. It stops at 62 rather than running to the edge, so the
       chevron has somewhere to be. -->
  <rect x="4" y="26" width="58" height="44" rx="22" fill="url(#action-ramp)"/>

  <!-- The label on it. Centred in the pill, not offset: a circle or an
       off-centre mark here turns the button into a toggle switch. -->
  <rect x="18" y="43" width="30" height="10" rx="5" fill="#F8FAFC"/>

  <!-- The event leaving. `stroke-linejoin="round"` matters more than it looks:
       a mitred join at this weight throws a spike past the canvas edge. -->
  <path d="M74 30 L90 48 L74 66" stroke="url(#action-ramp)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
